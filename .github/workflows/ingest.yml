name: Nightly market ingest
on:
  schedule:
    # GitHub often starts scheduled runs hours late at busy times, so each market has a backup run.
    # Runs are idempotent (dated by the latest bar), so a second run just refreshes the same day.
    - cron: '23 21 * * 1-5'   # US, after the 4 PM ET close
    - cron: '47 23 * * 1-5'   # US backup
    - cron: '19 10 * * 1-5'   # India, after the 3:30 PM IST close
    - cron: '41 12 * * 1-5'   # India backup
  workflow_dispatch:
    inputs:
      market: { description: 'US, IN or GLOBAL', required: true, default: 'US' }
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || 'SIXXAB Money support@sunilkattikar.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ github.event.inputs.market }}";
          else case "${{ github.event.schedule }}" in "19 10 * * 1-5"|"41 12 * * 1-5") M="IN";; *) M="US";; esac; fi
          npx tsx scripts/ingest.ts "$M"
          if [ "$M" = "US" ]; then npx tsx scripts/ingest.ts GLOBAL; fi
          npx tsx scripts/sync-videos.ts || echo "video sync failed (non-blocking)"
          npx tsx scripts/welcome-emails.ts || echo "welcome emails step failed (non-blocking)"
