name: Strategy portfolios
# First trading day of each month (and on demand): backtest and rebalance the model portfolios, commit the JSON so the site updates.
on:
  schedule:
    - cron: '17 22 1-3 * *'   # after the US close on the 1st-3rd; the script uses the latest close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portfolios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsx scripts/portfolios.ts
      - name: Commit results
        run: |
          git config user.name "SIXXAB Money bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/portfolios-US.json
          git diff --cached --quiet || (git commit -m "Strategy portfolios: monthly update" && git push)
